[bit]
diameter   = 1   # bit diameter (same units as below)
ipm        = 60   # cutting feed rate (mm/min — or in/min if units = "in")
plunge_rate = 30   # plunge feed rate

[workpiece]
width  = 20.5   # X dimension (how far to step across)
length = 13   # Y dimension (length of each pass)
depth  = 0.032 #0.007 #0.032   # how deep to cut (positive number)

[surfacing]
overlap_pct  = 70   # % overlap between passes (40% → step-over = 60% of diameter)
entry_offset =  0.6   # how far off the workpiece corner (in -X and -Y) to start before plunging
strategy     = "conventional"   # "zigzag" (bidirectional), "conventional" (+Y only), or "climb" (-Y only)

[machine]
safe_z = 0.15          # clearance height for rapid moves
units  = "in"       # "mm" or "in"
port   = "/dev/tty.usbserial-XXXX"   # serial port; leave as-is to be prompted
baud   = 115200
